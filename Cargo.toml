[package]
name = "ocr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
indicatif = "0.18.6"
libc = "0.2.190"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tl = "0.7.8"
toml = "1.1.6"
ureq = { version = "3", default-features = false }

# Off macOS, PDFs and images are read with pdfium and the `image`/`tiff` crates (PLAN §9).
[target.'cfg(not(target_os = "macos"))'.dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "gif", "webp"] }
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "thread_safe", "image_025"] }
tiff = "0.11.3"

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
